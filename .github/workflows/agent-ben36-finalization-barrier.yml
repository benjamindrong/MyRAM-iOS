                      && completionBarrierSatisfied {
                      stableZeroSamples += 1
                      if stableZeroSamples >= 5 { return 0 }
                  } else {
                      stableZeroSamples = 0
                  }
                  try? await Task.sleep(nanoseconds: 1_000_000_000)
              }
              return lastDepth
          }
