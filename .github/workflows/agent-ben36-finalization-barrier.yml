name: Agent BEN-36 finalization barrier correction

on:
  push:
    branches:
      - agent-BEN-36-finalization-barrier-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact BEN-36 head
        uses: actions/checkout@v7
        with:
          ref: BEN-36-MyRAM-sync-endurance-harness
          fetch-depth: 0

      - name: Verify exact starting state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin BEN-36-MyRAM-sync-endurance-harness
          test "$(git rev-parse HEAD)" = "06ccb4856b01759815f4243d7a50b9bfab27d75d"
          test "$(git rev-parse FETCH_HEAD)" = "06ccb4856b01759815f4243d7a50b9bfab27d75d"

      - name: Fetch reviewed patch helper
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            https://raw.githubusercontent.com/benjamindrong/MyRAM-iOS/c69bd48525db824aa92e05054bdff0d447b8a934/.github/agent-ben36-finalization-patch.py \
            -o /tmp/agent-ben36-finalization-patch.py
          test "$(shasum -a 256 /tmp/agent-ben36-finalization-patch.py | awk '{print $1}')" = "$(curl --fail --silent --show-error https://raw.githubusercontent.com/benjamindrong/MyRAM-iOS/c69bd48525db824aa92e05054bdff0d447b8a934/.github/agent-ben36-finalization-patch.py | shasum -a 256 | awk '{print $1}')"

      - name: Add cross-device finalization barrier
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/agent-ben36-finalization-patch.py

      - name: Verify bounded harness-only diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fxq 'MyRAM/Sync/MyRAMSyncModels.swift'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'MyRAMTests/SyncBatchEnvelopeV2Tests.swift'
          git diff --check
          grep -q 'completionBarrierSatisfied' MyRAM/Sync/MyRAMSyncModels.swift
          grep -q 'testEnduranceFinalizationBarrierRequiresBothPlatformMarkers' MyRAMTests/SyncBatchEnvelopeV2Tests.swift

      - name: Commit and push BEN-36 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MyRAM/Sync/MyRAMSyncModels.swift MyRAMTests/SyncBatchEnvelopeV2Tests.swift
          git commit -m "BEN-36 Synchronize final digest capture"
          git push origin HEAD:refs/heads/BEN-36-MyRAM-sync-endurance-harness
