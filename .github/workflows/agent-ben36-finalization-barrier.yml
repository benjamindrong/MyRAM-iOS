name: Agent BEN-36 finalization barrier correction

on:
  push:
    branches:
      - agent-BEN-36-finalization-barrier-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact BEN-36 head
        uses: actions/checkout@v7
        with:
          ref: BEN-36-MyRAM-sync-endurance-harness
          fetch-depth: 0

      - name: Verify exact starting state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin BEN-36-MyRAM-sync-endurance-harness
          test "$(git rev-parse HEAD)" = "06ccb4856b01759815f4243d7a50b9bfab27d75d"
          test "$(git rev-parse FETCH_HEAD)" = "06ccb4856b01759815f4243d7a50b9bfab27d75d"

      - name: Add cross-device finalization barrier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("MyRAM/Sync/MyRAMSyncModels.swift")
          test_path = Path("MyRAMTests/SyncBatchEnvelopeV2Tests.swift")
          text = source_path.read_text(encoding="utf-8")

          def replace_once(haystack, old, new, label):
              count = haystack.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 anchor, found {count}")
              return haystack.replace(old, new, 1)

          def replace_region(haystack, start_marker, end_marker, old, new, label):
              start = haystack.index(start_marker)
              end = haystack.index(end_marker, start)
              region = haystack[start:end]
              count = region.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 regional anchor, found {count}")
              region = region.replace(old, new, 1)
              return haystack[:start] + region + haystack[end:]

          old = r'''    static func mutationToken(
              platform: MyRAMSyncBenchmarkPlatform,
              operation: Int
          ) -> String {
              "\n\(platform.rawValue)-op-\(operation)"
          }

          static func outageWindows(totalDurationSeconds: Int) -> [OutageWindow] {
          '''
          new = r'''    static func mutationToken(
              platform: MyRAMSyncBenchmarkPlatform,
              operation: Int
          ) -> String {
              "\n\(platform.rawValue)-op-\(operation)"
          }

          static func completionMarker(
              runID: String,
              platform: MyRAMSyncBenchmarkPlatform
          ) -> String {
              "\nBEN36-finalized-\(runID)-\(platform.rawValue)"
          }

          static func bodyByAppendingCompletionMarker(
              _ body: String,
              runID: String,
              platform: MyRAMSyncBenchmarkPlatform
          ) -> String {
              let marker = completionMarker(runID: runID, platform: platform)
              return body.contains(marker) ? body : body + marker
          }

          static func completionBarrierSatisfied(
              noteBodiesByTitle: [String: String],
              runID: String
          ) -> Bool {
              [MyRAMSyncBenchmarkPlatform.iOS, .macOS].allSatisfy { platform in
                  let title = noteTitle(runID: runID, platform: platform, index: 1)
                  guard let body = noteBodiesByTitle[title] else { return false }
                  return body.contains(completionMarker(runID: runID, platform: platform))
              }
          }

          static func outageWindows(totalDurationSeconds: Int) -> [OutageWindow] {
          '''
          text = replace_once(text, old, new, "workload barrier helpers")

          old = r'''    static func expectedTitlesObserved(
              _ digests: [MyRAMSyncBenchmarkEnduranceNoteDigest],
              runID: String
          ) -> Bool {
          '''
          new = r'''    static func benchmarkNoteBodies(
              notes: [Note],
              runID: String
          ) -> [String: String] {
              let prefix = "BEN36-\(runID)-"
              var bodies: [String: String] = [:]
              for note in notes where note.deletedAt == nil && note.title.hasPrefix(prefix) {
                  bodies[note.title] = note.content
              }
              return bodies
          }

          static func expectedTitlesObserved(
