name: Apply MYR-175 Slice 1

on:
  push:
    branches:
      - MYR-175-Slice-1-Sibling-ordering-contract-and-structural-traversal

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact tested patch
        run: git apply --check .github/MYR-175-Slice-1.patch && git apply .github/MYR-175-Slice-1.patch

      - name: Verify exact source blobs
        run: |
          test "$(git hash-object Packages/AnchoredSequenceCore/Sources/AnchoredSequenceCore/SyncTextSequenceState.swift)" = "395c8f317febe44bcb08a7e4dbe9caeeae97b971"
          test "$(git hash-object Packages/AnchoredSequenceCore/Sources/AnchoredSequenceCore/SyncOperationIDOrder.swift)" = "cecabadc0600f180a6d140e4ed35bd1e91a8354e"
          test "$(git hash-object Packages/AnchoredSequenceCore/Tests/AnchoredSequenceCoreTests/SyncTextSequenceStateTests.swift)" = "ad7ff30fecf629ac9bb5837f0c486f8b9d14c163"

      - name: Run focused sequence-state tests
        run: swift test --package-path Packages/AnchoredSequenceCore --filter SyncTextSequenceStateTests

      - name: Run complete package tests
        run: swift test --package-path Packages/AnchoredSequenceCore

      - name: Audit patch
        run: git diff --check

      - name: Commit implementation
        run: |
          rm .github/MYR-175-Slice-1.patch .github/workflows/myr175-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages/AnchoredSequenceCore/Sources/AnchoredSequenceCore/SyncOperationIDOrder.swift
          git add Packages/AnchoredSequenceCore/Sources/AnchoredSequenceCore/SyncTextSequenceState.swift
          git add Packages/AnchoredSequenceCore/Tests/AnchoredSequenceCoreTests/SyncTextSequenceStateTests.swift
          git add -u .github
          git commit -m "MYR-175 Separate sibling order from canonical run storage"
          git push origin "HEAD:${GITHUB_REF_NAME}"
