name: MYR-175 Slice 2 Apple Review Remediation

on:
  push:
    branches:
      - MYR-175-Slice-2-Structural-insert-incorporation-and-anchor-resolution

permissions:
  contents: write

concurrency:
  group: myr-175-slice-2-apple-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - name: Check out existing PR branch
        uses: actions/checkout@v4
        with:
          ref: MYR-175-Slice-2-Structural-insert-incorporation-and-anchor-resolution
          fetch-depth: 0

      - name: Confirm staged-remediation scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=0a65817fa835398d95927e167ada3233ec4ef5ca
          git merge-base --is-ancestor "$BASE" HEAD
          actual="$(git diff --name-only "$BASE"...HEAD | sort)"
          expected="$(printf '%s\n' \
            .github/myr175-remediation/patch.b64.00 \
            .github/myr175-remediation/patch.b64.01 \
            .github/myr175-remediation/patch.b64.02 \
            .github/myr175-remediation/patch.b64.03 \
            .github/myr175-remediation/patch.b64.04 \
            .github/myr175-remediation/patch.b64.05 \
            .github/workflows/myr-175-slice-2-linux-remediation.yml \
            .github/workflows/myr-175-slice-2-review-remediation.yml | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected staged-remediation scope:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
          echo "STARTING_HEAD=$(git rev-parse HEAD)"

      - name: Reconstruct and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          root = Path('.github/myr175-remediation')
          expected = {
              'patch.b64.00': '13c3419fae685ac49ee4abcbe9d84bd2ad281a21c50e1e3fd3946e0144b360d0',
              'patch.b64.01': 'df2d27f1061aa699eb1c35dd3c9921677f0747d48be9c8e60febdde0835aeed1',
              'patch.b64.02': 'b9c036ea8009a24802a812b3dfde64586efe68468d21e4b32e63d4876d32d241',
              'patch.b64.03': '2cb221894a40bfeac89355c3bff42d3c4c2133643aed54e98f51238844f80249',
              'patch.b64.04': '33f197fe8126de4b7cacc45a973869438ac3be7b914fe8f86920c7e8380a82f1',
              'patch.b64.05': '3ab310972049d2709a56d89c38409cd0629d4973401155b41c0e0f7498705074',
          }

          first = root / 'patch.b64.00'
          first.write_bytes(first.read_bytes()[:6000])

          chunks = []
          for name, digest in expected.items():
              data = (root / name).read_bytes()
              actual = hashlib.sha256(data).hexdigest()
              if actual != digest:
                  raise SystemExit(f'{name} checksum mismatch: {actual}')
              chunks.append(data)

          encoded = b''.join(chunks)
          aggregate = hashlib.sha256(encoded).hexdigest()
          if aggregate != '57cae4c17d23626d516c6f031ee867ac7d8a2a6826c9becebb7ce07d47860165':
              raise SystemExit(f'aggregate checksum mismatch: {aggregate}')

          Path('/tmp/myr175-remediate.py').write_bytes(
              base64.b64decode(encoded, validate=True)
          )
          PY
          python3 -m py_compile /tmp/myr175-remediate.py
          python3 /tmp/myr175-remediate.py

      - name: Commit narrow remediation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            .github/myr175-remediation \
            .github/workflows/myr-175-slice-2-linux-remediation.yml \
            .github/workflows/myr-175-slice-2-review-remediation.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check

          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/myr175-remediation/patch.b64.00 \
            .github/myr175-remediation/patch.b64.01 \
            .github/myr175-remediation/patch.b64.02 \
            .github/myr175-remediation/patch.b64.03 \
            .github/myr175-remediation/patch.b64.04 \
            .github/myr175-remediation/patch.b64.05 \
            .github/workflows/myr-175-slice-2-linux-remediation.yml \
            .github/workflows/myr-175-slice-2-review-remediation.yml \
            Packages/AnchoredSequenceCore/Sources/AnchoredSequenceCore/SyncTextSequenceState.swift \
            Packages/AnchoredSequenceCore/Tests/AnchoredSequenceCoreTests/SyncTextSequenceInsertionTests.swift \
            docs/MYR-175-structural-insert-alignment.md | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected remediation commit scope:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi

          git commit -m "MYR-175 Cache anchor capture index and close coverage gaps"
          test -z "$(git status --short)"
          echo "CANDIDATE_HEAD=$(git rev-parse HEAD)"

      - name: Report Swift toolchain
        run: xcrun swift --version

      - name: Run complete package Debug suite
        shell: bash
        run: |
          set -euo pipefail
          xcrun swift package --package-path Packages/AnchoredSequenceCore clean
          xcrun swift test \
            --package-path Packages/AnchoredSequenceCore \
            --configuration debug \
            --parallel

      - name: Run complete package Release suite
        shell: bash
        run: |
          set -euo pipefail
          xcrun swift package --package-path Packages/AnchoredSequenceCore clean
          xcrun swift test \
            --package-path Packages/AnchoredSequenceCore \
            --configuration release \
            --parallel

      - name: Confirm final PR scope and publish tested remediation
        shell: bash
        run: |
          set -euo pipefail
          BASE=19ae86b1552246092a5435636779a2f7a6ba6181
          actual="$(git diff --name-only "$BASE"...HEAD | sort)"
          expected="$(printf '%s\n' \
            Packages/AnchoredSequenceCore/Sources/AnchoredSequenceCore/SyncTextSequenceState.swift \
            Packages/AnchoredSequenceCore/Tests/AnchoredSequenceCoreTests/SyncTextOperationPayloadTests.swift \
            Packages/AnchoredSequenceCore/Tests/AnchoredSequenceCoreTests/SyncTextSequenceInsertionTests.swift \
            docs/MYR-175-structural-insert-alignment.md | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected final PR scope:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
          git diff --check "$BASE"...HEAD
          test -z "$(git status --short)"
          echo "TESTED_HEAD=$(git rev-parse HEAD)"
          git push origin HEAD:MYR-175-Slice-2-Structural-insert-incorporation-and-anchor-resolution
