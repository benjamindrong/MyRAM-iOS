name: MYR-175 Slice 2 Review Remediation

on:
  push:
    branches:
      - MYR-175-Slice-2-Structural-insert-incorporation-and-anchor-resolution

permissions:
  contents: write

concurrency:
  group: myr-175-slice-2-review-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15-arm64
    steps:
      - name: Check out existing PR branch
        uses: actions/checkout@v4
        with:
          ref: MYR-175-Slice-2-Structural-insert-incorporation-and-anchor-resolution
          fetch-depth: 0

      - name: Confirm starting head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0a65817fa835398d95927e167ada3233ec4ef5ca"
          echo "STARTING_HEAD=$(git rev-parse HEAD)"

      - name: Apply narrow review remediation
