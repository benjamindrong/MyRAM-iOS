      - name: Remove temporary workflow and commit remediation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/myr-175-slice-2-review-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Packages/AnchoredSequenceCore/Sources/AnchoredSequenceCore/SyncTextSequenceState.swift \
            Packages/AnchoredSequenceCore/Tests/AnchoredSequenceCoreTests/SyncTextSequenceInsertionTests.swift \
            docs/MYR-175-structural-insert-alignment.md \
