name: MYR-175 Slice 1 final gates

on:
  push:
    branches:
      - MYR-175-verification-runner-4

permissions:
  contents: write

jobs:
  audit:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          repository: benjamindrong/MyRAM-iOS
          ref: 3dbfcff9053fc38b980738cad9bcea603e7c99c1
          fetch-depth: 0
      - run: |
          set -o pipefail
          mkdir -p evidence/audit
          if test -d /Applications/Xcode_26.5.app; then sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer; fi
          xcodebuild -version | tee evidence/audit/xcode-version.txt
          git diff --check e51ccca9ff6a77c8648e365b6569313c55c1e9d4...HEAD | tee evidence/audit/diff-check.log
          git diff --name-only e51ccca9ff6a77c8648e365b6569313c55c1e9d4...HEAD | tee evidence/audit/changed-files.txt
          diff -u <(printf '%s\n' \
            'Packages/AnchoredSequenceCore/Sources/AnchoredSequenceCore/SyncOperationIDOrder.swift' \
            'Packages/AnchoredSequenceCore/Sources/AnchoredSequenceCore/SyncTextSequenceState.swift' \
            'Packages/AnchoredSequenceCore/Tests/AnchoredSequenceCoreTests/SyncTextSequenceStateTests.swift' \
            'docs/MYR-175-structural-insert-alignment.md') evidence/audit/changed-files.txt
          test "$(git hash-object Packages/AnchoredSequenceCore/Sources/AnchoredSequenceCore/SyncTextSequenceState.swift)" = 395c8f317febe44bcb08a7e4dbe9caeeae97b971
          test "$(git hash-object Packages/AnchoredSequenceCore/Sources/AnchoredSequenceCore/SyncOperationIDOrder.swift)" = cecabadc0600f180a6d140e4ed35bd1e91a8354e
          test "$(git hash-object Packages/AnchoredSequenceCore/Tests/AnchoredSequenceCoreTests/SyncTextSequenceStateTests.swift)" = ad7ff30fecf629ac9bb5837f0c486f8b9d14c163
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-audit
          path: evidence/audit

  ios-tests:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: benjamindrong/MyRAM-iOS
          ref: 3dbfcff9053fc38b980738cad9bcea603e7c99c1
          path: MyRAM-iOS
      - uses: actions/checkout@v4
        with:
          repository: benjamindrong/NearbySyncCore
          ref: 4ab9eb91e6390947a7a2e9a4c2ec74012b4bc0e2
          path: NearbySyncCore
      - working-directory: MyRAM-iOS
        run: |
          set -o pipefail
          mkdir -p evidence/ios-tests
          if test -d /Applications/Xcode_26.5.app; then sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer; fi
          xcodebuild -version | tee evidence/ios-tests/xcode-version.txt
          git -C ../NearbySyncCore status --porcelain=v1 -uall > evidence/ios-tests/sibling-before.txt
          xcrun simctl list devices available -j > evidence/ios-tests/simulators.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('evidence/ios-tests/simulators.json').read_text())
          devices=[]
          for runtime, values in data.get('devices',{}).items():
              if 'iOS-26-5' not in runtime: continue
              for value in values:
                  if value.get('isAvailable') and value.get('name','').startswith('iPhone'):
                      devices.append((0 if value['name']=='iPhone 17' else 1,value['name'],value['udid']))
          if not devices: raise SystemExit('No iOS 26.5 iPhone simulator')
          devices.sort(); _,name,udid=devices[0]
          Path('evidence/ios-tests/selected-simulator.txt').write_text(f'{name} | iOS 26.5 | {udid}\n')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write(f'IOS_UDID={udid}\n')
          PY
          cat evidence/ios-tests/selected-simulator.txt
          xcodebuild -project MyRAM.xcodeproj -scheme MyRAM \
            -destination "platform=iOS Simulator,id=${IOS_UDID}" -destination-timeout 180 \
            -parallel-testing-enabled NO \
            -derivedDataPath /tmp/MYR175-Final-iOS-DD \
            -resultBundlePath /tmp/MYR175-Final-iOS.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            test 2>&1 | tee evidence/ios-tests/test.log
          git -C ../NearbySyncCore status --porcelain=v1 -uall > evidence/ios-tests/sibling-after.txt
          diff -u evidence/ios-tests/sibling-before.txt evidence/ios-tests/sibling-after.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-ios-tests
          path: MyRAM-iOS/evidence/ios-tests

  mac-tests:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: benjamindrong/MyRAM-iOS
          ref: 3dbfcff9053fc38b980738cad9bcea603e7c99c1
          path: MyRAM-iOS
      - uses: actions/checkout@v4
        with:
          repository: benjamindrong/NearbySyncCore
          ref: 4ab9eb91e6390947a7a2e9a4c2ec74012b4bc0e2
          path: NearbySyncCore
      - working-directory: MyRAM-iOS
        run: |
          set -o pipefail
          mkdir -p evidence/mac-tests
          if test -d /Applications/Xcode_26.5.app; then sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer; fi
          xcodebuild -version | tee evidence/mac-tests/xcode-version.txt
          git -C ../NearbySyncCore status --porcelain=v1 -uall > evidence/mac-tests/sibling-before.txt
          xcodebuild -project MyRAM.xcodeproj -scheme MyRAMMac -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            -derivedDataPath /tmp/MYR175-Final-Mac-DD \
            -resultBundlePath /tmp/MYR175-Final-Mac.xcresult \
            DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES PROVISIONING_PROFILE= PROVISIONING_PROFILE_SPECIFIER= \
            test 2>&1 | tee evidence/mac-tests/test.log
          git -C ../NearbySyncCore status --porcelain=v1 -uall > evidence/mac-tests/sibling-after.txt
          diff -u evidence/mac-tests/sibling-before.txt evidence/mac-tests/sibling-after.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-mac-tests
          path: MyRAM-iOS/evidence/mac-tests

  record:
    if: always()
    needs: [audit, ios-tests, mac-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - run: |
          RESULT=verification-results/MYR-175-Slice-1-3dbfcff9053fc38b980738cad9bcea603e7c99c1-final-gates
          mkdir -p "$RESULT"
          cat > "$RESULT/outcomes.txt" <<EOF
          audit=${{ needs.audit.result }}
          ios_tests=${{ needs.ios-tests.result }}
          mac_tests=${{ needs.mac-tests.result }}
          EOF
          {
            echo '# MYR-175 Slice 1 Final Exact-Head Gates'
            echo
            echo '- Candidate: `3dbfcff9053fc38b980738cad9bcea603e7c99c1`'
            echo '```text'
            cat "$RESULT/outcomes.txt"
            echo '```'
            echo '```text'
            find downloaded -type f -name '*.log' | while read file; do grep -E 'Executed [0-9]+ tests|TEST SUCCEEDED|TEST FAILED|BUILD SUCCEEDED|BUILD FAILED' "$file" || true; done
            echo '```'
          } > "$RESULT/summary.md"
          find downloaded -type f \( -name '*.log' -o -name 'xcode-version.txt' -o -name 'selected-simulator.txt' -o -name 'changed-files.txt' -o -name 'sibling-before.txt' -o -name 'sibling-after.txt' \) | while read file; do
            dest="$RESULT/${file#downloaded/}"
            mkdir -p "$(dirname "$dest")"
            if [[ "$file" == *.log ]]; then tail -n 240 "$file" > "$dest"; else cp "$file" "$dest"; fi
          done
          rm .github/workflows/myr175-final-gates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification-results
          git add -u .github
          git commit -m 'MYR-175 Record final exact-head gates'
          git push origin "HEAD:${GITHUB_REF_NAME}"
