name: MYR-175 Slice 1 corrected test environments

on:
  push:
    branches:
      - MYR-175-verification-runner-5

permissions:
  contents: write

jobs:
  ios-tests:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: benjamindrong/MyRAM-iOS
          ref: 3dbfcff9053fc38b980738cad9bcea603e7c99c1
          path: MyRAM-iOS
      - uses: actions/checkout@v4
        with:
          repository: benjamindrong/NearbySyncCore
          ref: 4ab9eb91e6390947a7a2e9a4c2ec74012b4bc0e2
          path: NearbySyncCore
      - working-directory: MyRAM-iOS
        run: |
          set -o pipefail
          mkdir -p evidence/ios
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version | tee evidence/ios/xcode-version.txt
          git -C ../NearbySyncCore status --porcelain=v1 -uall > evidence/ios/sibling-before.txt
          xcrun simctl list devices available -j > evidence/ios/simulators.json
          IOS_UDID="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('evidence/ios/simulators.json').read_text())
          candidates=[]
          for runtime, values in data.get('devices',{}).items():
              if 'iOS-26-5' not in runtime: continue
              for value in values:
                  if value.get('isAvailable') and value.get('name','').startswith('iPhone'):
                      candidates.append((0 if value['name']=='iPhone 17' else 1,value['name'],value['udid']))
          if not candidates: raise SystemExit('No iOS 26.5 iPhone simulator')
          candidates.sort(); _,name,udid=candidates[0]
          Path('evidence/ios/selected-simulator.txt').write_text(f'{name} | iOS 26.5 | {udid}\n')
          print(udid)
          PY
          )"
          test -n "$IOS_UDID"
          cat evidence/ios/selected-simulator.txt
          xcodebuild -project MyRAM.xcodeproj -scheme MyRAM \
            -destination "platform=iOS Simulator,id=${IOS_UDID}" -destination-timeout 180 \
            -parallel-testing-enabled NO \
            -derivedDataPath /tmp/MYR175-Corrected-iOS-DD \
            -resultBundlePath /tmp/MYR175-Corrected-iOS.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            test 2>&1 | tee evidence/ios/test.log
          git -C ../NearbySyncCore status --porcelain=v1 -uall > evidence/ios/sibling-after.txt
          diff -u evidence/ios/sibling-before.txt evidence/ios/sibling-after.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-ios-tests
          path: MyRAM-iOS/evidence/ios

  mac-tests:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: benjamindrong/MyRAM-iOS
          ref: 3dbfcff9053fc38b980738cad9bcea603e7c99c1
          path: MyRAM-iOS
      - uses: actions/checkout@v4
        with:
          repository: benjamindrong/NearbySyncCore
          ref: 4ab9eb91e6390947a7a2e9a4c2ec74012b4bc0e2
          path: NearbySyncCore
      - working-directory: MyRAM-iOS
        run: |
          set -o pipefail
          mkdir -p evidence/mac
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version | tee evidence/mac/xcode-version.txt
          sudo scutil --set ComputerName MyRAMCI
          sudo scutil --set LocalHostName MyRAMCI
          sudo scutil --set HostName MyRAMCI
          scutil --get ComputerName | tee evidence/mac/computer-name.txt
          hostname | tee evidence/mac/hostname.txt
          git -C ../NearbySyncCore status --porcelain=v1 -uall > evidence/mac/sibling-before.txt
          xcodebuild -project MyRAM.xcodeproj -scheme MyRAMMac -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            -derivedDataPath /tmp/MYR175-Corrected-Mac-DD \
            -resultBundlePath /tmp/MYR175-Corrected-Mac.xcresult \
            DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES PROVISIONING_PROFILE= PROVISIONING_PROFILE_SPECIFIER= \
            test 2>&1 | tee evidence/mac/test.log
          git -C ../NearbySyncCore status --porcelain=v1 -uall > evidence/mac/sibling-after.txt
          diff -u evidence/mac/sibling-before.txt evidence/mac/sibling-after.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-mac-tests
          path: MyRAM-iOS/evidence/mac

  record:
    if: always()
    needs: [ios-tests, mac-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - run: |
          RESULT=verification-results/MYR-175-Slice-1-3dbfcff9053fc38b980738cad9bcea603e7c99c1-corrected-tests
          mkdir -p "$RESULT"
          cat > "$RESULT/outcomes.txt" <<EOF
          ios_tests=${{ needs.ios-tests.result }}
          mac_tests=${{ needs.mac-tests.result }}
          EOF
          {
            echo '# MYR-175 Slice 1 Corrected Exact-Head Test Environments'
            echo
            echo '- Candidate: `3dbfcff9053fc38b980738cad9bcea603e7c99c1`'
            echo '```text'
            cat "$RESULT/outcomes.txt"
            echo '```'
            echo '```text'
            find downloaded -type f -name '*.log' | while read file; do grep -E 'Executed [0-9]+ tests|TEST SUCCEEDED|TEST FAILED|BUILD SUCCEEDED|BUILD FAILED' "$file" || true; done
            echo '```'
          } > "$RESULT/summary.md"
          find downloaded -type f \( -name '*.log' -o -name 'xcode-version.txt' -o -name 'selected-simulator.txt' -o -name 'computer-name.txt' -o -name 'hostname.txt' -o -name 'sibling-before.txt' -o -name 'sibling-after.txt' \) | while read file; do
            dest="$RESULT/${file#downloaded/}"
            mkdir -p "$(dirname "$dest")"
            if [[ "$file" == *.log ]]; then tail -n 300 "$file" > "$dest"; else cp "$file" "$dest"; fi
          done
          rm .github/workflows/myr175-test-environment-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification-results
          git add -u .github
          git commit -m 'MYR-175 Record corrected exact-head test results'
          git push origin "HEAD:${GITHUB_REF_NAME}"
