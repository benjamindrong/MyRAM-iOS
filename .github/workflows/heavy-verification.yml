name: Heavy Verification (Trusted Self-Hosted Mac)

"on":
  workflow_dispatch:
    inputs:
      profile:
        description: Heavy verification profile
        required: true
        default: ios
        type: choice
        options:
          - ios
          - mac
          - ui

permissions:
  contents: read

concurrency:
  group: myram-heavy-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: true

jobs:
  verify:
    name: Heavy ${{ inputs.profile }} verification
    if: ${{ github.actor == github.repository_owner }}
    runs-on: myram-trusted-heavy
    timeout-minutes: 45
    steps:
      - name: Assert trusted dispatch context
        env:
          EXPECTED_OWNER: ${{ github.repository_owner }}
          EXPECTED_REPOSITORY: benjamindrong/MyRAM-iOS
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_ACTOR" == "$EXPECTED_OWNER" ]]
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]]
          case "${{ inputs.profile }}" in
            ios|mac|ui) ;;
            *) exit 2 ;;
          esac

      - name: Check out MyRAM candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          path: MyRAM-iOS
          persist-credentials: false
          clean: true

      - name: Check out NearbySyncCore sibling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: benjamindrong/NearbySyncCore
          ref: 4ab9eb91e6390947a7a2e9a4c2ec74012b4bc0e2
          path: NearbySyncCore
          persist-credentials: false
          clean: true

      - name: Prepare deterministic build state
        run: |
          set -euo pipefail
          derived_data="$RUNNER_TEMP/MyRAMHeavyDerivedData"
          echo "DERIVED_DATA=$derived_data" >> "$GITHUB_ENV"
          rm -rf "$derived_data"
          mkdir -p "$derived_data"

      - name: Verify Xcode 26.6
        working-directory: MyRAM-iOS
        run: |
          set -euo pipefail
          xcode-select -p
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          version_line="${xcode_version%%$'\n'*}"
          [[ "$version_line" == "Xcode 26.6" ]]

      - name: Select iOS simulator
        if: ${{ inputs.profile == 'ios' || inputs.profile == 'ui' }}
        run: |
          set -euo pipefail
          simulator_udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = [
              device
              for runtime, runtime_devices in data["devices"].items()
              if "iOS" in runtime
              for device in runtime_devices
              if device.get("isAvailable") and device.get("name", "").startswith("iPhone")
          ]
          preferred = next((device for device in devices if device["name"] == "iPhone Air"), None)
          selected = preferred or (devices[0] if devices else None)
          if selected is None:
              raise SystemExit("No available iPhone simulator")
          print(selected["udid"])
          ')"
          echo "SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          echo "Selected simulator: $simulator_udid"

      - name: Run complete iOS application suite
        if: ${{ inputs.profile == 'ios' }}
        working-directory: MyRAM-iOS
        run: |
          set -euo pipefail
          xcodebuild \
            -project MyRAM.xcodeproj \
            -scheme MyRAM \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:MyRAMTests \
            test

      - name: Run complete Mac application suite
        if: ${{ inputs.profile == 'mac' }}
        working-directory: MyRAM-iOS
        run: |
          set -euo pipefail
          xcodebuild \
            -project MyRAM.xcodeproj \
            -scheme MyRAMMac \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:MyRAMMacTests \
            test

      - name: Run iOS UI suite
        if: ${{ inputs.profile == 'ui' }}
        working-directory: MyRAM-iOS
        run: |
          set -euo pipefail
          xcodebuild \
            -project MyRAM.xcodeproj \
            -scheme MyRAM \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:MyRAMUITests \
            test

      - name: Shut down selected simulator
        if: ${{ always() && (inputs.profile == 'ios' || inputs.profile == 'ui') }}
        run: |
          set +e
          if [[ -n "${SIMULATOR_UDID:-}" ]]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" >/dev/null 2>&1 || true
          fi

      - name: Remove DerivedData
        if: ${{ always() }}
        run: rm -rf "$DERIVED_DATA"
