name: MYR-175 baseline failure classification

on:
  push:
    branches:
      - MYR-175-verification-runner-6

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: benjamindrong/MyRAM-iOS
          ref: 3dbfcff9053fc38b980738cad9bcea603e7c99c1
          path: Candidate
      - uses: actions/checkout@v4
        with:
          repository: benjamindrong/MyRAM-iOS
          ref: e51ccca9ff6a77c8648e365b6569313c55c1e9d4
          path: Baseline
      - uses: actions/checkout@v4
        with:
          repository: benjamindrong/NearbySyncCore
          ref: 4ab9eb91e6390947a7a2e9a4c2ec74012b4bc0e2
          path: NearbySyncCore
      - run: |
          set -e
          mkdir -p evidence/ios
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version | tee evidence/ios/xcode-version.txt
          xcrun simctl list devices available -j > evidence/ios/simulators.json
          IOS_UDID="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('evidence/ios/simulators.json').read_text())
          candidates=[]
          for runtime, values in data.get('devices',{}).items():
              if 'iOS-26-5' not in runtime: continue
              for value in values:
                  if value.get('isAvailable') and value.get('name','').startswith('iPhone'):
                      candidates.append((0 if value['name']=='iPhone 17' else 1,value['name'],value['udid']))
          if not candidates: raise SystemExit('No iOS 26.5 simulator')
          candidates.sort(); _,name,udid=candidates[0]
          Path('evidence/ios/selected-simulator.txt').write_text(f'{name} | iOS 26.5 | {udid}\n')
          print(udid)
          PY
          )"
          set +e
          (cd Candidate && xcodebuild -project MyRAM.xcodeproj -scheme MyRAM \
            -destination "platform=iOS Simulator,id=${IOS_UDID}" -destination-timeout 180 \
            -parallel-testing-enabled NO -derivedDataPath /tmp/MYR175-Classify-Candidate-iOS \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            test -only-testing:MyRAMTests/SyncConvergencePlanningTests) \
            > evidence/ios/candidate.log 2>&1
          CANDIDATE=$?
          (cd Baseline && xcodebuild -project MyRAM.xcodeproj -scheme MyRAM \
            -destination "platform=iOS Simulator,id=${IOS_UDID}" -destination-timeout 180 \
            -parallel-testing-enabled NO -derivedDataPath /tmp/MYR175-Classify-Baseline-iOS \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            test -only-testing:MyRAMTests/SyncConvergencePlanningTests) \
            > evidence/ios/baseline.log 2>&1
          BASELINE=$?
          set -e
          printf 'candidate_exit=%s\nbaseline_exit=%s\n' "$CANDIDATE" "$BASELINE" > evidence/ios/outcomes.txt
          grep -E 'Test Case .*failed|error:|Executed [0-9]+ tests|TEST SUCCEEDED|TEST FAILED' evidence/ios/candidate.log > evidence/ios/candidate-summary.txt || true
          grep -E 'Test Case .*failed|error:|Executed [0-9]+ tests|TEST SUCCEEDED|TEST FAILED' evidence/ios/baseline.log > evidence/ios/baseline-summary.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classification-ios
          path: evidence/ios

  mac:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: benjamindrong/MyRAM-iOS
          ref: 3dbfcff9053fc38b980738cad9bcea603e7c99c1
          path: Candidate
      - uses: actions/checkout@v4
        with:
          repository: benjamindrong/MyRAM-iOS
          ref: e51ccca9ff6a77c8648e365b6569313c55c1e9d4
          path: Baseline
      - uses: actions/checkout@v4
        with:
          repository: benjamindrong/NearbySyncCore
          ref: 4ab9eb91e6390947a7a2e9a4c2ec74012b4bc0e2
          path: NearbySyncCore
      - run: |
          set -e
          mkdir -p evidence/mac
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version | tee evidence/mac/xcode-version.txt
          sudo scutil --set ComputerName MyRAMCI
          sudo scutil --set LocalHostName MyRAMCI
          sudo scutil --set HostName MyRAMCI
          set +e
          (cd Candidate && xcodebuild -project MyRAM.xcodeproj -scheme MyRAMMac -destination 'platform=macOS' \
            -parallel-testing-enabled NO -derivedDataPath /tmp/MYR175-Classify-Candidate-Mac \
            DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES PROVISIONING_PROFILE= PROVISIONING_PROFILE_SPECIFIER= \
            test -only-testing:MyRAMMacTests/SyncConvergencePlanningTests) \
            > evidence/mac/candidate.log 2>&1
          CANDIDATE=$?
          (cd Baseline && xcodebuild -project MyRAM.xcodeproj -scheme MyRAMMac -destination 'platform=macOS' \
            -parallel-testing-enabled NO -derivedDataPath /tmp/MYR175-Classify-Baseline-Mac \
            DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES PROVISIONING_PROFILE= PROVISIONING_PROFILE_SPECIFIER= \
            test -only-testing:MyRAMMacTests/SyncConvergencePlanningTests) \
            > evidence/mac/baseline.log 2>&1
          BASELINE=$?
          set -e
          printf 'candidate_exit=%s\nbaseline_exit=%s\n' "$CANDIDATE" "$BASELINE" > evidence/mac/outcomes.txt
          grep -E 'Test Case .*failed|error:|Executed [0-9]+ tests|TEST SUCCEEDED|TEST FAILED' evidence/mac/candidate.log > evidence/mac/candidate-summary.txt || true
          grep -E 'Test Case .*failed|error:|Executed [0-9]+ tests|TEST SUCCEEDED|TEST FAILED' evidence/mac/baseline.log > evidence/mac/baseline-summary.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classification-mac
          path: evidence/mac

  record:
    if: always()
    needs: [ios, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - run: |
          RESULT=verification-results/MYR-175-Slice-1-3dbfcff9053fc38b980738cad9bcea603e7c99c1-baseline-classification
          mkdir -p "$RESULT"
          cp -R downloaded/. "$RESULT/"
          {
            echo '# MYR-175 Slice 1 Baseline Failure Classification'
            echo
            echo '## iOS'
            cat downloaded/classification-ios/outcomes.txt
            cat downloaded/classification-ios/candidate-summary.txt
            cat downloaded/classification-ios/baseline-summary.txt
            echo
            echo '## Mac'
            cat downloaded/classification-mac/outcomes.txt
            cat downloaded/classification-mac/candidate-summary.txt
            cat downloaded/classification-mac/baseline-summary.txt
          } > "$RESULT/summary.md"
          rm .github/workflows/myr175-baseline-classification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification-results
          git add -u .github
          git commit -m 'MYR-175 Record baseline failure classification'
          git push origin "HEAD:${GITHUB_REF_NAME}"
