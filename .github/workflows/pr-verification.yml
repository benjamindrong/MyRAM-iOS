name: PR verification

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  diff-audit:
    name: Diff audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      xcode-required: ${{ steps.changes.outputs.xcode-required }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: MyRAM-iOS

      - name: Run git diff check
        working-directory: MyRAM-iOS
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git diff --check origin/main...HEAD

      - name: Detect documentation-only changes
        id: changes
        working-directory: MyRAM-iOS
        run: |
          set -euo pipefail
          xcode_required=false
          while IFS= read -r path; do
            case "$path" in
              *.md|docs/*) ;;
              *) xcode_required=true; break ;;
            esac
          done < <(git diff --name-only origin/main...HEAD)
          echo "xcode-required=$xcode_required" >> "$GITHUB_OUTPUT"

  ios-tests:
    name: iOS application tests
    needs: diff-audit
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && needs.diff-audit.outputs.xcode-required == 'true')
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Check out MyRAM candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: MyRAM-iOS

      - name: Check out NearbySyncCore sibling
        uses: actions/checkout@v7
        with:
          repository: benjamindrong/NearbySyncCore
          ref: 4ab9eb91e6390947a7a2e9a4c2ec74012b4bc0e2
          path: NearbySyncCore

      - name: Show Xcode version
        working-directory: MyRAM-iOS
        run: xcodebuild -version

      - name: Run complete iOS application suite
        working-directory: MyRAM-iOS
        run: |
          set -euo pipefail
          simulator_udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = [
              device
              for runtime, runtime_devices in data["devices"].items()
              if "iOS" in runtime
              for device in runtime_devices
              if device.get("isAvailable") and device.get("name", "").startswith("iPhone")
          ]
          if not devices:
              raise SystemExit("No available iPhone simulator")
          print(devices[0]["udid"])
          ')"
          echo "Selected simulator: $simulator_udid"
          xcodebuild \
            -project MyRAM.xcodeproj \
            -scheme MyRAM \
            -destination "platform=iOS Simulator,id=$simulator_udid" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:MyRAMTests \
            test

  mac-tests:
    name: Mac application tests
    needs: diff-audit
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && needs.diff-audit.outputs.xcode-required == 'true')
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Check out MyRAM candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: MyRAM-iOS

      - name: Check out NearbySyncCore sibling
        uses: actions/checkout@v7
        with:
          repository: benjamindrong/NearbySyncCore
          ref: 4ab9eb91e6390947a7a2e9a4c2ec74012b4bc0e2
          path: NearbySyncCore

      - name: Show Xcode version
        working-directory: MyRAM-iOS
        run: xcodebuild -version

      - name: Run complete Mac application suite
        working-directory: MyRAM-iOS
        run: |
          set -euo pipefail
          xcodebuild \
            -project MyRAM.xcodeproj \
            -scheme MyRAMMac \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:MyRAMMacTests \
            test

  ui-tests:
    name: iOS UI tests (manual only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Check out MyRAM candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: MyRAM-iOS

      - name: Check out NearbySyncCore sibling
        uses: actions/checkout@v7
        with:
          repository: benjamindrong/NearbySyncCore
          ref: 4ab9eb91e6390947a7a2e9a4c2ec74012b4bc0e2
          path: NearbySyncCore

      - name: Show Xcode version
        working-directory: MyRAM-iOS
        run: xcodebuild -version

      - name: Run iOS UI suite
        working-directory: MyRAM-iOS
        run: |
          set -euo pipefail
          simulator_udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = [
              device
              for runtime, runtime_devices in data["devices"].items()
              if "iOS" in runtime
              for device in runtime_devices
              if device.get("isAvailable") and device.get("name", "").startswith("iPhone")
          ]
          if not devices:
              raise SystemExit("No available iPhone simulator")
          print(devices[0]["udid"])
          ')"
          echo "Selected simulator: $simulator_udid"
          xcodebuild \
            -project MyRAM.xcodeproj \
            -scheme MyRAM \
            -destination "platform=iOS Simulator,id=$simulator_udid" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:MyRAMUITests \
            test
