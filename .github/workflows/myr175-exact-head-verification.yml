name: Verify MYR-175 Slice 1 exact head

on:
  push:
    branches:
      - MYR-175-verification-runner

permissions:
  contents: write

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact MYR-175 head
        uses: actions/checkout@v4
        with:
          repository: benjamindrong/MyRAM-iOS
          ref: 3dbfcff9053fc38b980738cad9bcea603e7c99c1
          path: MyRAM-iOS

      - name: Checkout preserved sibling dependency
        uses: actions/checkout@v4
        with:
          repository: benjamindrong/NearbySyncCore
          ref: 4ab9eb91e6390947a7a2e9a4c2ec74012b4bc0e2
          path: NearbySyncCore

      - name: Record environment and resolve simulator
        id: environment
        continue-on-error: true
        working-directory: MyRAM-iOS
        run: |
          set -o pipefail
          mkdir -p verification
          xcodebuild -version | tee verification/xcode-version.txt
          swift --version | tee verification/swift-version.txt
          uname -a | tee verification/uname.txt
          git rev-parse HEAD | tee verification/verified-head.txt
          test "$(git rev-parse HEAD)" = "3dbfcff9053fc38b980738cad9bcea603e7c99c1"
          xcodebuild -project MyRAM.xcodeproj -scheme MyRAM -showdestinations | tee verification/ios-destinations.txt
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          text = Path('verification/ios-destinations.txt').read_text()
          candidates = []
          for line in text.splitlines():
              if 'platform:iOS Simulator' not in line or 'name:iPhone' not in line:
                  continue
              match = re.search(r'id:([^,}]+)', line)
              name = re.search(r'name:([^,}]+)', line)
              if match:
                  candidates.append((0 if name and 'iPhone 16 Pro' in name.group(1) else 1, match.group(1).strip(), line.strip()))
          if not candidates:
              raise SystemExit('No concrete iPhone simulator destination found')
          candidates.sort()
          udid = candidates[0][1]
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'IOS_SIMULATOR_UDID={udid}\n')
          Path('verification/selected-simulator.txt').write_text(candidates[0][2] + '\n')
          PY
          cat verification/selected-simulator.txt

      - name: Focused package tests
        id: package_focused
        continue-on-error: true
        working-directory: MyRAM-iOS
        run: |
          set -o pipefail
          mkdir -p verification
          swift test --package-path Packages/AnchoredSequenceCore --filter SyncTextSequenceStateTests 2>&1 | tee verification/package-focused.log

      - name: Complete package tests
        id: package_complete
        continue-on-error: true
        working-directory: MyRAM-iOS
        run: |
          set -o pipefail
          mkdir -p verification
          swift test --package-path Packages/AnchoredSequenceCore 2>&1 | tee verification/package-complete.log

      - name: Complete iOS tests
        id: ios_tests
        continue-on-error: true
        working-directory: MyRAM-iOS
        run: |
          set -o pipefail
          mkdir -p verification
          xcodebuild -project MyRAM.xcodeproj -scheme MyRAM \
            -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_UDID}" \
            -derivedDataPath verification/DerivedData-iOS-Tests \
            -resultBundlePath verification/MYR175-iOS-Tests.xcresult \
            test 2>&1 | tee verification/ios-tests.log

      - name: Complete native Mac tests
        id: mac_tests
        continue-on-error: true
        working-directory: MyRAM-iOS
        run: |
          set -o pipefail
          mkdir -p verification
          xcodebuild -project MyRAM.xcodeproj -scheme MyRAMMac \
            -destination 'platform=macOS' \
            -derivedDataPath verification/DerivedData-Mac-Tests \
            -resultBundlePath verification/MYR175-Mac-Tests.xcresult \
            test 2>&1 | tee verification/mac-tests.log

      - name: iOS application build
        id: ios_build
        continue-on-error: true
        working-directory: MyRAM-iOS
        run: |
          set -o pipefail
          mkdir -p verification
          xcodebuild -project MyRAM.xcodeproj -scheme MyRAM \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath verification/DerivedData-iOS-Build \
            build 2>&1 | tee verification/ios-build.log

      - name: Native Mac application build
        id: mac_build
        continue-on-error: true
        working-directory: MyRAM-iOS
        run: |
          set -o pipefail
          mkdir -p verification
          xcodebuild -project MyRAM.xcodeproj -scheme MyRAMMac \
            -destination 'platform=macOS' \
            -derivedDataPath verification/DerivedData-Mac-Build \
            build 2>&1 | tee verification/mac-build.log

      - name: Static and exact-scope audits
        id: audits
        continue-on-error: true
        working-directory: MyRAM-iOS
        run: |
          set -o pipefail
          mkdir -p verification
          git diff --check e51ccca9ff6a77c8648e365b6569313c55c1e9d4...HEAD 2>&1 | tee verification/diff-check.log
          git diff --name-only e51ccca9ff6a77c8648e365b6569313c55c1e9d4...HEAD | tee verification/changed-files.txt
          diff -u <(printf '%s\n' \
            'Packages/AnchoredSequenceCore/Sources/AnchoredSequenceCore/SyncOperationIDOrder.swift' \
            'Packages/AnchoredSequenceCore/Sources/AnchoredSequenceCore/SyncTextSequenceState.swift' \
            'Packages/AnchoredSequenceCore/Tests/AnchoredSequenceCoreTests/SyncTextSequenceStateTests.swift' \
            'docs/MYR-175-structural-insert-alignment.md') verification/changed-files.txt
          test "$(git hash-object Packages/AnchoredSequenceCore/Sources/AnchoredSequenceCore/SyncTextSequenceState.swift)" = "395c8f317febe44bcb08a7e4dbe9caeeae97b971"
          test "$(git hash-object Packages/AnchoredSequenceCore/Sources/AnchoredSequenceCore/SyncOperationIDOrder.swift)" = "cecabadc0600f180a6d140e4ed35bd1e91a8354e"
          test "$(git hash-object Packages/AnchoredSequenceCore/Tests/AnchoredSequenceCoreTests/SyncTextSequenceStateTests.swift)" = "ad7ff30fecf629ac9bb5837f0c486f8b9d14c163"
          test "$(git -C ../NearbySyncCore rev-parse HEAD)" = "4ab9eb91e6390947a7a2e9a4c2ec74012b4bc0e2"
          test -z "$(git -C ../NearbySyncCore status --porcelain)"

      - name: Write matrix summary
        if: always()
        working-directory: MyRAM-iOS
        run: |
          mkdir -p verification
          cat > verification/matrix-outcomes.txt <<EOF
          environment=${{ steps.environment.outcome }}
          package_focused=${{ steps.package_focused.outcome }}
          package_complete=${{ steps.package_complete.outcome }}
          ios_tests=${{ steps.ios_tests.outcome }}
          mac_tests=${{ steps.mac_tests.outcome }}
          ios_build=${{ steps.ios_build.outcome }}
          mac_build=${{ steps.mac_build.outcome }}
          audits=${{ steps.audits.outcome }}
          EOF
          cat verification/matrix-outcomes.txt

      - name: Build committed verification record
        if: always()
        working-directory: MyRAM-iOS
        run: |
          RESULT_DIR="../verification-results/MYR-175-Slice-1-3dbfcff9053fc38b980738cad9bcea603e7c99c1"
          mkdir -p "$RESULT_DIR"
          cp verification/matrix-outcomes.txt "$RESULT_DIR/"
          for file in xcode-version.txt swift-version.txt uname.txt verified-head.txt selected-simulator.txt changed-files.txt diff-check.log; do
            if test -f "verification/$file"; then cp "verification/$file" "$RESULT_DIR/"; fi
          done
          {
            echo '# MYR-175 Slice 1 Exact-Head Verification'
            echo
            echo '- Candidate head: `3dbfcff9053fc38b980738cad9bcea603e7c99c1`'
            echo '- Baseline: `e51ccca9ff6a77c8648e365b6569313c55c1e9d4`'
            echo '- Sibling dependency: `4ab9eb91e6390947a7a2e9a4c2ec74012b4bc0e2`'
            echo
            echo '## Outcomes'
            echo '```text'
            cat verification/matrix-outcomes.txt
            echo '```'
            echo
            echo '## Observed command summaries'
            echo '```text'
            grep -hE 'Executed [0-9]+ tests|Test Suite .* passed|TEST SUCCEEDED|TEST FAILED|BUILD SUCCEEDED|BUILD FAILED' verification/*.log 2>/dev/null || true
            echo '```'
          } > "$RESULT_DIR/summary.md"
          {
            for file in package-focused.log package-complete.log ios-tests.log mac-tests.log ios-build.log mac-build.log; do
              echo "===== $file ====="
              if test -f "verification/$file"; then tail -n 120 "verification/$file"; else echo 'missing'; fi
            done
          } > "$RESULT_DIR/diagnostic-tails.txt"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myr175-slice1-exact-head-verification
          path: MyRAM-iOS/verification
          if-no-files-found: error
          retention-days: 7

      - name: Commit verification result and retire runner
        if: always()
        run: |
          rm .github/workflows/myr175-exact-head-verification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification-results
          git add -u .github
          git commit -m "MYR-175 Record exact-head verification results"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Enforce complete matrix
        if: always()
        run: |
          test "${{ steps.environment.outcome }}" = success
          test "${{ steps.package_focused.outcome }}" = success
          test "${{ steps.package_complete.outcome }}" = success
          test "${{ steps.ios_tests.outcome }}" = success
          test "${{ steps.mac_tests.outcome }}" = success
          test "${{ steps.ios_build.outcome }}" = success
          test "${{ steps.mac_build.outcome }}" = success
          test "${{ steps.audits.outcome }}" = success
