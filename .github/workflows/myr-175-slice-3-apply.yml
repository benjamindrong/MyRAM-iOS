name: MYR-175 Slice 3 implementation

on:
  push:
    branches:
      - MYR-175-Slice-3-Dark-replay-integration-and-completion-evidence

permissions:
  contents: write

concurrency:
  group: myr-175-slice-3-implementation
  cancel-in-progress: false

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply Slice 3 implementation
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_myr_175_slice_3.py
          rm .github/scripts/apply_myr_175_slice_3.py
          rm .github/workflows/myr-175-slice-3-apply.yml

      - name: Static validation
        run: |
          set -euo pipefail
          plutil -lint MyRAM.xcodeproj/project.pbxproj
          git diff --check
          test "$(grep -c 'SyncBatchAnchoredInsertReplay.swift in Sources' MyRAM.xcodeproj/project.pbxproj)" -eq 4
          test "$(grep -c 'SyncBatchAnchoredInsertReplayTests.swift in Sources' MyRAM.xcodeproj/project.pbxproj)" -eq 4
          ! grep -Eq 'utf16Offset|baseContentHash|import SwiftData|ModelContext|NSString|NSRange|syncBatchInserting|syncBatchSafeInsertionOffset' MyRAM/Sync/Batch/SyncBatchAnchoredInsertReplay.swift
          test "$(grep -c 'incorporating(' MyRAM/Sync/Batch/SyncBatchAnchoredInsertReplay.swift)" -eq 1
          ! grep -R 'SyncBatchAnchoredInsertReplay' MyRAM --include='*.swift' --exclude='SyncBatchAnchoredInsertReplay.swift'
          grep -q 'static let isEnabled = false' MyRAM/Sync/Batch/SyncBatchAnchoredPayloadPolicy.swift

      - name: Package verification
        run: |
          set -euo pipefail
          swift test --package-path Packages/AnchoredSequenceCore
          swift test -c release --package-path Packages/AnchoredSequenceCore

      - name: Focused host verification
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project MyRAM.xcodeproj -scheme MyRAM
          SIM_UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime in d["devices"].values() for x in runtime if x["name"].startswith("iPhone") and x.get("isAvailable")))')"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcodebuild -project MyRAM.xcodeproj -scheme MyRAM -destination "id=$SIM_UDID" -only-testing:MyRAMTests/SyncBatchAnchoredInsertReplayTests -derivedDataPath /tmp/MYR175-iOS-focused test
          xcodebuild -project MyRAM.xcodeproj -scheme MyRAMMac -destination 'platform=macOS' -only-testing:MyRAMMacTests/SyncBatchAnchoredInsertReplayTests -derivedDataPath /tmp/MYR175-Mac-focused test
          xcodebuild -project MyRAM.xcodeproj -scheme MyRAM -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/MYR175-iOS-build CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project MyRAM.xcodeproj -scheme MyRAMMac -destination 'platform=macOS' -derivedDataPath /tmp/MYR175-Mac-build CODE_SIGNING_ALLOWED=NO build

      - name: Commit tested implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MyRAM.xcodeproj/project.pbxproj MyRAM/Sync/Batch/SyncBatchAnchoredInsertReplay.swift MyRAMTests/SyncBatchAnchoredInsertReplayTests.swift MyRAMMacTests/SyncBatchAnchoredInsertReplayTests.swift MyRAMMacTests/MacSyncBatchControllerTests.swift .github/scripts/apply_myr_175_slice_3.py .github/workflows/myr-175-slice-3-apply.yml
          git commit -m 'MYR-175 Add dark anchored insert replay seam'
          git push origin HEAD:${GITHUB_REF_NAME}
