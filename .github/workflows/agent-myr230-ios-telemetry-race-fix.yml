name: Agent MYR-230 iOS telemetry race correction

on:
  push:
    branches:
      - agent-MYR-230-ios-telemetry-race-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          ref: cf55fded7b997935a443ac83b31b10337ee03e7f
          fetch-depth: 0

      - name: Verify exact current PR head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin MYR-230-Preserve-batch-acknowledgement-ownership-across-disconnect
          test "$(git rev-parse HEAD)" = "cf55fded7b997935a443ac83b31b10337ee03e7f"
          test "$(git rev-parse FETCH_HEAD)" = "cf55fded7b997935a443ac83b31b10337ee03e7f"

      - name: Correct terminal telemetry wait
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("MyRAMTests/SyncBatchEnvelopeV2Tests.swift")
          text = path.read_text(encoding="utf-8")
          test_start = "    func testControllerDefersPermittedAcknowledgementUntilPeerReconnects() async throws {\n"
          test_end = "    func testControllerRecordsTransportFailureWithoutSuccess() async throws {\n"
          if text.count(test_start) != 1 or text.count(test_end) != 1:
              raise SystemExit("non-unique test anchors")
          start = text.index(test_start)
          end = text.index(test_end, start)
          region = text[start:end]
          needle = "        await waitUntil { transport.sentBatchAcknowledgements.count == 1 }\n"
          if region.count(needle) != 1:
              raise SystemExit(f"expected one transport wait, found {region.count(needle)}")
          terminal_wait = (
              needle
              + "        await waitUntil {\n"
              + "            guard let recordedEvents = try? self.events(from: recorder) else { return false }\n"
              + "            return recordedEvents.contains {\n"
              + "                $0.eventType == .batchAcknowledgementSent &&\n"
              + "                $0.batchID == batchID &&\n"
              + "                $0.peerDeviceID == \"ack-reconnect-peer\"\n"
              + "            }\n"
              + "        }\n"
          )
          region = region.replace(needle, terminal_wait, 1)
          path.write_text(text[:start] + region + text[end:], encoding="utf-8")
          PY

      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "MyRAMTests/SyncBatchEnvelopeV2Tests.swift"
          git diff --check
          git diff -- MyRAMTests/SyncBatchEnvelopeV2Tests.swift

      - name: Commit and push existing PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MyRAMTests/SyncBatchEnvelopeV2Tests.swift
          git commit -m "MYR-230 Stabilize acknowledgement telemetry regression"
          git push origin HEAD:refs/heads/MYR-230-Preserve-batch-acknowledgement-ownership-across-disconnect
