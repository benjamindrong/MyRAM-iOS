name: MYR-175 split iOS exact-head verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ios-application-tests:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: benjamindrong/MyRAM-iOS
          ref: 42368ff5a4ec3291a95a2733f82d78c9f91c2a9d
          path: MyRAM-iOS

      - name: Checkout preserved sibling dependency
        uses: actions/checkout@v4
        with:
          repository: benjamindrong/NearbySyncCore
          ref: 4ab9eb91e6390947a7a2e9a4c2ec74012b4bc0e2
          path: NearbySyncCore

      - name: Run complete iOS application-test inventory
        working-directory: MyRAM-iOS
        run: |
          set -o pipefail
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
          test "$(git rev-parse HEAD)" = "42368ff5a4ec3291a95a2733f82d78c9f91c2a9d"
          test "$(git -C ../NearbySyncCore rev-parse HEAD)" = "4ab9eb91e6390947a7a2e9a4c2ec74012b4bc0e2"
          git -C ../NearbySyncCore status --porcelain=v1 -uall > /tmp/myr175-ios-app-sibling-before.txt
          xcrun simctl list devices available -j > /tmp/myr175-ios-app-simulators.json
          IOS_UDID="$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/myr175-ios-app-simulators.json'))
          candidates=[]
          for runtime, values in data.get('devices',{}).items():
              if 'iOS-26-5' not in runtime: continue
              for value in values:
                  if value.get('isAvailable') and value.get('name','').startswith('iPhone'):
                      candidates.append((0 if value['name']=='iPhone 17' else 1,value['name'],value['udid']))
          if not candidates: raise SystemExit('No iOS 26.5 iPhone simulator')
          candidates.sort(); print(candidates[0][2])
          PY
          )"
          test -n "$IOS_UDID"
          xcodebuild -project MyRAM.xcodeproj -scheme MyRAM \
            -destination "platform=iOS Simulator,id=${IOS_UDID}" -destination-timeout 180 \
            -parallel-testing-enabled NO \
            -derivedDataPath /tmp/MYR175-Split-iOS-App-DD \
            -resultBundlePath /tmp/MYR175-Split-iOS-App.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            test -skip-testing:MyRAMUITests 2>&1 | tee /tmp/myr175-ios-app-tests.log
          git -C ../NearbySyncCore status --porcelain=v1 -uall > /tmp/myr175-ios-app-sibling-after.txt
          diff -u /tmp/myr175-ios-app-sibling-before.txt /tmp/myr175-ios-app-sibling-after.txt

  ios-ui-tests:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: benjamindrong/MyRAM-iOS
          ref: 42368ff5a4ec3291a95a2733f82d78c9f91c2a9d
          path: MyRAM-iOS

      - name: Checkout preserved sibling dependency
        uses: actions/checkout@v4
        with:
          repository: benjamindrong/NearbySyncCore
          ref: 4ab9eb91e6390947a7a2e9a4c2ec74012b4bc0e2
          path: NearbySyncCore

      - name: Run complete iOS UI-test inventory
        working-directory: MyRAM-iOS
        run: |
          set -o pipefail
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
          test "$(git rev-parse HEAD)" = "42368ff5a4ec3291a95a2733f82d78c9f91c2a9d"
          test "$(git -C ../NearbySyncCore rev-parse HEAD)" = "4ab9eb91e6390947a7a2e9a4c2ec74012b4bc0e2"
          git -C ../NearbySyncCore status --porcelain=v1 -uall > /tmp/myr175-ios-ui-sibling-before.txt
          xcrun simctl list devices available -j > /tmp/myr175-ios-ui-simulators.json
          IOS_UDID="$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/myr175-ios-ui-simulators.json'))
          candidates=[]
          for runtime, values in data.get('devices',{}).items():
              if 'iOS-26-5' not in runtime: continue
              for value in values:
                  if value.get('isAvailable') and value.get('name','').startswith('iPhone'):
                      candidates.append((0 if value['name']=='iPhone 17' else 1,value['name'],value['udid']))
          if not candidates: raise SystemExit('No iOS 26.5 iPhone simulator')
          candidates.sort(); print(candidates[0][2])
          PY
          )"
          test -n "$IOS_UDID"
          xcodebuild -project MyRAM.xcodeproj -scheme MyRAM \
            -destination "platform=iOS Simulator,id=${IOS_UDID}" -destination-timeout 180 \
            -parallel-testing-enabled NO \
            -derivedDataPath /tmp/MYR175-Split-iOS-UI-DD \
            -resultBundlePath /tmp/MYR175-Split-iOS-UI.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            test -only-testing:MyRAMUITests 2>&1 | tee /tmp/myr175-ios-ui-tests.log
          git -C ../NearbySyncCore status --porcelain=v1 -uall > /tmp/myr175-ios-ui-sibling-after.txt
          diff -u /tmp/myr175-ios-ui-sibling-before.txt /tmp/myr175-ios-ui-sibling-after.txt
